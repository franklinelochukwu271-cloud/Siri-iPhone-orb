<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sci-Fi Holographic Live Orb</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #03070d;
      color: #e0f2fe;
      font-family: monospace;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #holo-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 60%, #082136 0%, #030c17 45%, #010408 100%);
    }
    /* Raster Scanlines Overlay */
    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 5;
    }
    canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      cursor: grab;
      z-index: 4;
    }
    canvas:active { cursor: grabbing; }
    .hud-label {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #38bdf8;
      z-index: 10;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="holo-container">
    <canvas id="holo-canvas"></canvas>
    <div class="scanlines"></div>
    <div class="hud-label">Holographic Telemetry Matrix // Drag to Rotate</div>
  </div>

  <script>
    const canvas = document.getElementById('holo-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();

    let rotX = 0.2, rotY = 0.0, targetRotX = 0.2, targetRotY = 0.0;
    let isDragging = false, lastX = 0, lastY = 0, clock = 0;

    // Generate 3D Geodesic Sphere Nodes
    const NUM_LAT = 14, NUM_LON = 22, RADIUS = 150, nodes = [];
    for (let i = 0; i <= NUM_LAT; i++) {
      const theta = (i * Math.PI) / NUM_LAT;
      const y = RADIUS * Math.cos(theta);
      const ringRadius = RADIUS * Math.sin(theta);
      for (let j = 0; j < NUM_LON; j++) {
        const phi = (j * 2 * Math.PI) / NUM_LON;
        nodes.push({ origX: ringRadius * Math.sin(phi), origY: y, origZ: ringRadius * Math.cos(phi), latIdx: i });
      }
    }

    // Telemetry Rings
    const rings = [
      { r: 185, speed: 0.008, angle: 0, dash: [4, 8], color: 'rgba(56, 189, 248, 0.45)' },
      { r: 215, speed: -0.012, angle: 0.5, dash: [24, 12, 4, 12], color: 'rgba(168, 85, 247, 0.5)' },
      { r: 245, speed: 0.015, angle: 1.2, dash: [12, 18], color: 'rgba(6, 182, 212, 0.4)' }
    ];

    window.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      targetRotY += (e.clientX - lastX) * 0.008;
      targetRotX += (e.clientY - lastY) * 0.008;
      lastX = e.clientX; lastY = e.clientY;
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    function project(x, y, z, cx, cy) {
      let y1 = y * Math.cos(rotX) - z * Math.sin(rotX);
      let z1 = y * Math.sin(rotX) + z * Math.cos(rotX);
      let x2 = x * Math.cos(rotY) + z1 * Math.sin(rotY);
      let z2 = -x * Math.sin(rotY) + z1 * Math.cos(rotY);
      const fov = 600 / (600 + z2);
      return { x: cx + x2 * fov, y: cy + y1 * fov, visible: (600 + z2) > 0 };
    }

    function render() {
      clock += 0.02;
      rotX += (targetRotX - rotX) * 0.08;
      rotY += (targetRotY - rotY) * 0.08 + 0.004;

      ctx.clearRect(0, 0, width, height);
      const cx = width / 2, cy = height / 2;

      // Glowing Hologram Core
      const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 95);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.25, 'rgba(6, 182, 212, 0.85)');
      grad.addColorStop(0.6, 'rgba(168, 85, 247, 0.4)');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, 95, 0, Math.PI * 2);
      ctx.fill();

      // 3D Wireframe Spherical Lines
      const projNodes = nodes.map(n => project(n.origX, n.origY, n.origZ, cx, cy));
      for (let j = 0; j < NUM_LON; j++) {
        ctx.beginPath();
        let started = false;
        for (let i = 0; i <= NUM_LAT; i++) {
          const p = projNodes[i * NUM_LON + j];
          if (!p.visible) continue;
          if (!started) { ctx.moveTo(p.x, p.y); started = true; }
          else { ctx.lineTo(p.x, p.y); }
        }
        ctx.strokeStyle = j % 2 === 0 ? 'rgba(6, 182, 212, 0.4)' : 'rgba(168, 85, 247, 0.25)';
        ctx.stroke();
      }

      // Rotating Telemetry Rings
      rings.forEach(r => {
        r.angle += r.speed;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(r.angle);
        ctx.beginPath();
        ctx.arc(0, 0, r.r, 0, Math.PI * 2);
        ctx.setLineDash(r.dash);
        ctx.strokeStyle = r.color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      });

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
